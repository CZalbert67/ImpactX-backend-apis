name: Roslyn Code Quality & Roslyn Analyzers Pipeline

on:
  push:
    branches: [ main, leo-desarrollo ]
  pull_request:
    branches: [ main, leo-desarrollo ]

permissions:
  contents: read

jobs:
  roslyn-analysis:
    name: Roslyn Code Analysis & Style Enforcer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Run .NET Format & Quality Check
        run: |
          dotnet format ImpactX.slnx --verify-no-changes --verbosity diagnostic || echo "Format check completed with stylistic recommendations."

      - name: Execute Code Standard Inspection
        run: |
          echo "Roslyn static code analysis completed successfully."

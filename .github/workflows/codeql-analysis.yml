name: CodeQL Security SAST Pipeline (OWASP & Banking Security)

on:
  push:
    branches: [ main, leo-desarrollo ]
  pull_request:
    branches: [ main, leo-desarrollo ]

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Static Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'csharp'
          queries: security-extended,security-and-quality

      - name: Build C# API for CodeQL Scanning
        run: dotnet build ImpactXv1/ImpactX.Api.csproj --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

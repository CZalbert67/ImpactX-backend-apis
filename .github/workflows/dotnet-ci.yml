name: .NET CI Pipeline

on:
  push:
    branches: [ main, leo-desarrollo, feat/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Initialize hardcoded secrets policy report
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ImpactX Hardcoded Secrets Policy" > "${{ runner.temp }}/hardcoded-secrets-policy.txt"
          echo "================================" >> "${{ runner.temp }}/hardcoded-secrets-policy.txt"
          echo "Scanner execution has not completed. Review workflow logs." >> "${{ runner.temp }}/hardcoded-secrets-policy.txt"

      - name: Run hardcoded secrets policy tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover \
            -s scripts/security/tests \
            -p "test_*.py" \
            -v

      - name: Check hardcoded secrets policy
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/security/check_hardcoded_secrets.py \
            --report "${{ runner.temp }}/hardcoded-secrets-policy.txt"

      - name: Upload hardcoded-secrets-policy-report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardcoded-secrets-policy-report
          path: ${{ runner.temp }}/hardcoded-secrets-policy.txt
          if-no-files-found: error
          retention-days: 14

      - name: Verify frozen API contract files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validation/verify_contract_files.py

      - name: Restore and Audit Dependencies
        run: |
          dotnet restore ImpactX.slnx \
            -p:NuGetAudit=true \
            -p:NuGetAuditMode=all \
            "-warnaserror:NU1903;NU1904"
          dotnet package list \
            --project ImpactX.slnx \
            --vulnerable \
            --include-transitive \
            --no-restore

      - name: Build Application
        run: dotnet build ImpactX.slnx --no-restore --configuration Release

      - name: Run Tests with Coverage
        run: >
          dotnet test ImpactX.slnx
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          --results-directory "${{ runner.temp }}/TestResults"

      - name: Run security regression tests
        shell: bash
        run: |
          set -Eeuo pipefail

          dotnet test ImpactX.Tests/ImpactX.Tests.csproj \
            --configuration Release \
            --no-build \
            --filter "Category=Security" \
            --logger "trx;LogFileName=security-regression.trx" \
            --results-directory "${{ runner.temp }}/TestResults/Security" \
            --collect:"XPlat Code Coverage"

          TRX_FILE=$(find "${{ runner.temp }}/TestResults/Security" -name 'security-regression.trx' -print -quit)
          if [ -z "$TRX_FILE" ]; then
            echo "::error::security-regression.trx not found"
            exit 1
          fi

          python3 -c "import sys, xml.etree.ElementTree as ET; t = ET.parse('${TRX_FILE}'); r = t.getroot(); ns = {'x': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}; c = r.find('.//x:ResultSummary/x:Counters', ns); sys.exit(1) if c is None else None; total = int(c.get('total', '0')); executed = int(c.get('executed', '0')); passed = int(c.get('passed', '0')); failed = int(c.get('failed', '0')); skipped = total - executed; print(f'Total: {total}, Passed: {passed}, Failed: {failed}, Skipped: {skipped}'); sys.exit(1) if total == 0 else None; sys.exit(1) if failed > 0 else sys.exit(0)"

      - name: Upload security-regression-results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-regression-results
          path: |
            ${{ runner.temp }}/TestResults/Security/**/*.trx
            ${{ runner.temp }}/TestResults/Security/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload TRX Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-results
          path: ${{ runner.temp }}/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

  smoke-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ASPNETCORE_ENVIRONMENT: CI
      ASPNETCORE_URLS: http://127.0.0.1:5055
      UseCosmosDb: "false"
      UseInMemoryDatabase: "true"
      Jwt__Issuer: ImpactX-CI
      Jwt__Audience: ImpactX-CI-Client
    steps:
      - name: Generate ephemeral JWT secret
        shell: bash
        run: |
          set -Eeuo pipefail
          SECRET=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          echo "Jwt__Secret=${SECRET}" >> "$GITHUB_ENV"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API Project
        run: dotnet restore ImpactXv1/ImpactX.Api.csproj

      - name: Publish, Start, and Smoke Test
        run: |
          set -Eeuo pipefail

          PUBLISH_DIR="${{ runner.temp }}/publish"
          LOG_FILE="${{ runner.temp }}/api-log.txt"

          dotnet publish ImpactXv1/ImpactX.Api.csproj \
            --configuration Release \
            --output "$PUBLISH_DIR" \
            --no-restore \
            --nologo

          dotnet "$PUBLISH_DIR/ImpactX.Api.dll" > "$LOG_FILE" 2>&1 &
          API_PID=$!

          cleanup() {
            kill "$API_PID" 2>/dev/null || true
            wait "$API_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "::error::API process died before becoming ready"
              cat "$LOG_FILE"
              exit 1
            fi

            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:5055/health 2>/dev/null || echo "000")

            if [ "$code" = "200" ]; then
              echo "API is ready (attempt ${attempt})"
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "::error::API failed to respond after 30 attempts"
              cat "$LOG_FILE"
              exit 1
            fi

            sleep 2
          done

          # Validate /health, /health/live, /health/ready
          for endpoint in health health/live health/ready; do
            outfile="${{ runner.temp }}/$(echo "${endpoint}" | tr '/' '-').json"
            curl --fail --silent --show-error \
              --connect-timeout 2 --max-time 5 \
              "http://127.0.0.1:5055/${endpoint}" > "$outfile"
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['status']=='healthy'; assert d['service']=='impactx-api'; assert d['environment']=='CI'; assert 'timestamp' in d; import datetime; datetime.datetime.fromisoformat(d['timestamp']); print('OK')" "$outfile"
            echo "/${endpoint} OK"
          done

          # Validate /openapi/v1.json
          openapi_file="${{ runner.temp }}/openapi.json"
          curl --fail --silent --show-error \
            --connect-timeout 2 --max-time 5 \
            "http://127.0.0.1:5055/openapi/v1.json" > "$openapi_file"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert 'openapi' in d; assert 'paths' in d; assert isinstance(d['paths'], dict); print('OK')" "$openapi_file"
          echo "/openapi/v1.json OK"

          # Validate frozen client contract and version headers
          contract_file="${{ runner.temp }}/api-contract.json"
          header_file="${{ runner.temp }}/api-contract-headers.txt"
          curl --fail --silent --show-error \
            --dump-header "$header_file" \
            --connect-timeout 2 --max-time 5 \
            "http://127.0.0.1:5055/api/v1/meta/contract" > "$contract_file"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['apiVersion']=='v1'; assert d['contractVersion']=='2026.08.05'; assert d['status']=='frozen'; assert any(r['path']=='/api/v1/auth/login' and r['method']=='POST' for r in d['routes']); print('OK')" "$contract_file"
          grep -qi '^X-ImpactX-Api-Version: v1' "$header_file"
          grep -qi '^X-ImpactX-Contract-Version: 2026.08.05' "$header_file"
          echo "/api/v1/meta/contract OK"

          # Validate Swagger returns 404 in CI
          swagger_code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:5055/swagger/index.html)
          if [ "$swagger_code" != "404" ]; then
            echo "::error::Swagger returned ${swagger_code} instead of 404 in CI environment"
            exit 1
          fi
          echo "/swagger/index.html 404 OK"

          echo "All smoke tests passed"

      - name: Upload API Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-smoke-log
          path: ${{ runner.temp }}/api-log.txt
          if-no-files-found: warn
          retention-days: 7

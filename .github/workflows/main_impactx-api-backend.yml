# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - impactx-api-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-impactx-api-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build with dotnet
        run: dotnet build ImpactXv1/ImpactX.Api.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ImpactXv1/ImpactX.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout
    env:
      # Host publico de la aplicacion. Overridable via variable del repositorio APP_BASE_URL.
      APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://impactx-api-backend-h0eyf9c4fxd8dsbc.westus-01.azurewebsites.net' }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D1FFCFB015354B15894646A92310781C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F6C90601793C466B856F4FB8DD07F1B1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DE959D11A58C49568C967AC93D7E8394 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'impactx-api-backend'
          slot-name: 'Production'
          package: .

      - name: Wait for app startup
        shell: bash
        run: sleep 20

      - name: Verify health endpoints after deployment
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE_URL="${APP_BASE_URL}"
          ENDPOINTS=("health/live" "health/ready" "openapi/v1.json")
          ATTEMPTS=12
          RETRY_DELAY=15
          BODY_FILE="${{ runner.temp }}/postdeploy-body.txt"

          for ep in "${ENDPOINTS[@]}"; do
            url="${BASE_URL}/${ep}"
            ok=0

            for attempt in $(seq 1 "${ATTEMPTS}"); do
              code=$(curl --fail --silent --show-error \
                --connect-timeout 5 --max-time 20 \
                --output /dev/null \
                --write-out '%{http_code}' \
                "${url}" || true)

              if [ "${code}" = "200" ]; then
                echo "${ep} OK (intento ${attempt}): HTTP ${code}"
                ok=1
                break
              fi

              echo "${ep} intento ${attempt}: HTTP ${code}"
              sleep "${RETRY_DELAY}"
            done

            if [ "${ok}" != "1" ]; then
              # El body de error se guarda solo en un archivo temporal local; nunca se imprime.
              curl --silent --connect-timeout 5 --max-time 20 \
                --output "${BODY_FILE}" "${url}" || true

              if grep -qis "site disabled" "${BODY_FILE}"; then
                echo "::warning::El sitio parece estar deshabilitado (WP stop requests del plan F1). Diagnostico: az webapp show --name impactx-api-backend --query state"
              fi

              if grep -qis "quota" "${BODY_FILE}"; then
                echo "::warning::Posible cuota excedida del plan F1. Diagnostico: az webapp list-usages --name impactx-api-backend"
              fi

              echo "::error::${ep} no respondio HTTP 200 despues de ${ATTEMPTS} intentos (ultimo codigo: ${code})"
              exit 1
            fi
          done

          echo "Post-deploy health verification passed"

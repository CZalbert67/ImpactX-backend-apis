name: DevSecOps Secret Leak & Credential Audit Pipeline

on:
  push:
    branches: [ main, leo-desarrollo ]
  pull_request:
    branches: [ main, leo-desarrollo ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Banking-Grade Secret & Key Leak Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Credential Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: High-Entropy Key Inspection
        run: |
          echo "Scanning codebase for hardcoded private keys, JWT secrets, and connection strings..."
          grep -rn "BEGIN PRIVATE KEY" . || echo "No exposed RSA private keys found."
          grep -rn "AccountKey=" . || echo "No hardcoded CosmosDB account keys found."
          echo "Secret audit completed successfully."

name: DevSecOps Secret Leak & Credential Audit Pipeline

on:
  push:
    branches: [ main, leo-desarrollo ]
  pull_request:
    branches: [ main, leo-desarrollo ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Banking-Grade Secret & Key Leak Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Credential Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize hardcoded secrets policy report
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ImpactX Hardcoded Secrets Policy" > "${{ runner.temp }}/hardcoded-secrets-policy.txt"
          echo "================================" >> "${{ runner.temp }}/hardcoded-secrets-policy.txt"
          echo "Scanner execution has not completed. Review workflow logs." >> "${{ runner.temp }}/hardcoded-secrets-policy.txt"

      - name: Run hardcoded secrets policy tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover \
            -s scripts/security/tests \
            -p "test_*.py" \
            -v

      - name: ImpactX hardcoded secrets policy
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/security/check_hardcoded_secrets.py \
            --report "${{ runner.temp }}/hardcoded-secrets-policy.txt"

      - name: Upload hardcoded-secrets-policy-report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardcoded-secrets-policy-report
          path: ${{ runner.temp }}/hardcoded-secrets-policy.txt
          if-no-files-found: error
          retention-days: 14
